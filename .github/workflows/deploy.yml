name: Build Github Pages

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "5 2 * * *"

permissions:
  contents: write

env:
  YEAR: 2026

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          architecture: "x64"

      - run: |
          # --insecure is because the server seems to only return the leaf certificate and not the whole chain. When that is resolved I think --insecure can be removed
          curl --fail --location --insecure "https://www.losungen.de/fileadmin/media-losungen/download/Losung_${YEAR}_CSV.zip" | python3 scripts/convert-to-rss.py

      - name: Deploy 🚀
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: rss # The folder the action should deploy.
          branch: gh-pages # The branch the action should deploy to.
          git-config-name: "github-actions[bot]"
          git-config-email: "41898282+github-actions[bot]@users.noreply.github.com"

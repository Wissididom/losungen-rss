name: Build Github Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "5 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          architecture: "x64"

      - run: |
          # --insecure is because the server seems to only return the leaf certificate and not the whole chain. When that is resolved I think --insecure can be removed
          curl --fail --location --insecure "https://www.losungen.de/fileadmin/media-losungen/download/Losung_$(date +%Y)_CSV.zip" | python3 scripts/convert-to-rss.py

      - name: Deploy 🚀
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: rss # The folder the action should deploy.
          branch: gh-pages # The branch the action should deploy to.
          git-config-name: "github-actions[bot]"
          git-config-email: "41898282+github-actions[bot]@users.noreply.github.com"
